<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Page not found — NeuroMCQ</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="./assets/icons/favicon.svg" type="image/svg+xml">
  <style>
    body{font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background:#f3f4f6;background-image:radial-gradient(circle at top right,#e0e7ff 0%,transparent 40%);color:#1f2937;margin:0;min-height:100vh;display:grid;place-items:center;font-weight:700;padding:16px}
    .card{background:#fff;border-radius:20px;padding:2rem;max-width:480px;width:100%;box-shadow:0 10px 25px -3px rgba(0,0,0,.08);text-align:center}
    h1{color:#4338ca;font-weight:900;margin:.25rem 0 1rem}
    a{display:inline-block;margin-top:1rem;background:#4338ca;color:#fff;padding:.85rem 1.5rem;border-radius:10px;text-decoration:none;font-weight:800}
  </style>
</head>
<body>
  <main class="card">
    <div style="font-size:3rem">🧭</div>
    <h1>Page not found</h1>
    <p>This address does not exist in NeuroMCQ.</p>
    <!-- Works from a GitHub Pages sub-path and a Netlify root: go to the site root of this repo. -->
    <a id="home" href="./">Go to NeuroMCQ</a>
  </main>
  <script>
    (function () {
      // On GitHub Pages project sites (user.github.io/repo/...), point "home" at /repo/.
      var p = location.pathname.split('/').filter(Boolean);
      if (/github\.io$/.test(location.hostname) && p.length) document.getElementById('home').href = '/' + p[0] + '/';
      else document.getElementById('home').href = '/';
    })();
  </script>
</body>
</html>
